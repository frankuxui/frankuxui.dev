version: "3.9"

services:
  astro-dev:
    image: node:22-alpine
    container_name: astro-dev
    working_dir: /app
    volumes:
      - .:/app                # Monta tu proyecto local dentro del contenedor
      - /app/node_modules     # Evita conflictos con node_modules local
    command: sh -c "npm install && npm run dev"
    ports:
      - "4312:4312"
    environment:
      - NODE_ENV=development
